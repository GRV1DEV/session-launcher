<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Launcher</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>

  <div class="neon-bar"></div>
  <!-- Thin decorative gradient line at the very top of the popup. -->

  <div class="container">

    <h1 class="title"><span class="title-bolt">&#9889;</span> SESSION LAUNCHER <span class="version">v0.5</span></h1>

    <div class="save-row">
      <input
        type="text"
        id="session-name"
        class="session-name-input"
        placeholder="Name this session…"
        maxlength="60"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="btn-save" class="btn-save">SAVE</button>
    </div>

  </div>

  <div id="sessions-section" class="sessions-section">

    <div class="sessions-header">
      <span class="sessions-label">SAVED SESSIONS</span>
      <span id="sessions-count" class="sessions-count"></span>
      <!-- popup.js fills this badge with the session count when sessions exist. -->
    </div>

    <div id="sessions-list" class="sessions-list"></div>

  </div>

  <script src="popup.js"></script>

</body>
</html>
